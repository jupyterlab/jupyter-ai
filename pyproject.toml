# Root of the jupyter-ai monorepo. It is not a published package: it gives
# Jupyter Releaser the release version and its configuration. The packages live
# under python/ and are released together, with the same version.

[build-system]
requires = ["hatchling>=1.5.0"]
build-backend = "hatchling.build"

[project]
name = "jupyter_ai_root"
readme = "README.md"
license = { file = "LICENSE" }
dynamic = ["version"]

[tool.hatch.version]
path = "python/jupyter-ai/jupyter_ai/__init__.py"

[tool.jupyter-releaser.options]
python_packages = ["python/jupyter-ai-core", "python/jupyter-ai"]
# Runs once per package, and from the root for a post-release bump.
version_cmd = "python \"$(git rev-parse --show-toplevel)/scripts/bump_version.py\""

[tool.jupyter-releaser.hooks]
# During "Step 1: Prep Release", after the version is bumped and before the
# release is committed and tagged, freeze the documentation submodules to the
# released tags matching this version's dependency ranges. Between releases the
# submodules track each subpackage's `main` (freshest docs on the `latest`
# site); the release tag captures a frozen snapshot for the `stable` site. See
# scripts/freeze-doc-submodules.sh.
after-bump-version = ["bash scripts/freeze-doc-submodules.sh"]
