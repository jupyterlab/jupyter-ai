name: E2E tests

on:
  push:
    branches: main
  pull_request:
    branches: '*'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  mcp:
    # Renders as "E2E tests / MCP integration / default", ".../rtc", ".../rtc-jsd".
    name: MCP integration / ${{ matrix.variant }}
    runs-on: ubuntu-latest

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        variant: [default, rtc, rtc-jsd]

    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/pw-browsers

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Base Setup
        uses: jupyterlab/maintainer-tools/.github/actions/base-setup@b9d5c28489f8b460cef48868f303b97c20f8fe1b  # v1.1.2

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3

      - name: Install nox
        run: uv tool install nox

      - name: Restore browser cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ${{ github.workspace }}/pw-browsers
          key: ${{ runner.os }}-${{ hashFiles('ui-tests/yarn.lock') }}

      # jlpm needs a bootstrap jupyterlab, and `playwright install-deps` needs
      # sudo (unavailable inside a nox venv). nox reuses this node_modules +
      # browser cache; the per-transport server deps are installed by nox.
      - name: Set up ui-tests deps + browser
        working-directory: ui-tests
        env:
          YARN_ENABLE_IMMUTABLE_INSTALLS: 0
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
        run: |
          set -eux
          python -m pip install "jupyterlab>=4.4,<5"
          jlpm install
          jlpm playwright install-deps
          jlpm playwright install chromium

      - name: Run E2E tests (${{ matrix.variant }})
        run: |
          set -eux
          nox -s "e2e(env='${{ matrix.variant }}')"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: jupyter-ai-e2e-${{ matrix.variant }}
          path: |
            ui-tests/test-results
            ui-tests/playwright-report

  live_content:
    # Renders as "E2E tests / live-content / default", ".../rtc", ".../rtc-jsd".
    name: live-content / ${{ matrix.variant }}
    runs-on: ubuntu-latest

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        variant: [default, rtc, rtc-jsd]

    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/pw-browsers

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Base Setup
        uses: jupyterlab/maintainer-tools/.github/actions/base-setup@b9d5c28489f8b460cef48868f303b97c20f8fe1b  # v1.1.2

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3

      - name: Install nox
        run: uv tool install nox

      - name: Restore browser cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ${{ github.workspace }}/pw-browsers
          key: ${{ runner.os }}-${{ hashFiles('ui-tests/yarn.lock') }}

      # jlpm needs a bootstrap jupyterlab, and `playwright install-deps` needs
      # sudo (unavailable inside a nox venv). nox reuses this node_modules +
      # browser cache; the per-transport server deps are installed by nox.
      - name: Set up ui-tests deps + browser
        working-directory: ui-tests
        env:
          YARN_ENABLE_IMMUTABLE_INSTALLS: 0
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
        run: |
          set -eux
          python -m pip install "jupyterlab>=4.4,<5"
          jlpm install
          jlpm playwright install-deps
          jlpm playwright install chromium

      - name: Run E2E tests (${{ matrix.variant }})
        run: |
          set -eux
          nox -s "e2e_live_content(env='${{ matrix.variant }}')"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: jupyter-ai-e2e-live-content-${{ matrix.variant }}
          path: |
            ui-tests/test-results
            ui-tests/playwright-report
